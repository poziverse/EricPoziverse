user root;
worker_processes 1;
daemon off;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/nginx-access.log;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    sendfile on;

    # From the Poziverse V5 — static site, served by Nginx 1.10.3
    # Pages: index, article, watch, replies, downloads, library, now, about,
    #        annex (Learning Annex — Phase 7), club (Members Club — Phase 8),
    #        signin, account

    server {
        listen 9000;
        server_name _;
        root /code;
        index index.html index.htm;

        # Gzip common text types
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml application/javascript application/json application/xml;

        # Cache static assets for 1 day
        location ~* \.(woff2|css|js|png|jpg|jpeg|gif|svg|ico)$ {
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
            try_files $uri =404;
        }

        # Default document handling — SPA-style fallback so ?id= queries resolve to article.html etc.
        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        # Custom 404 — render the home for missing local paths so the Field Log stays reachable
        error_page 404 /index.html;
    }
}